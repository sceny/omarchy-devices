name: public-text

# The company's rules for public text, checked by a script (dev/public-text-check):
# a pull request's title, body, commit messages, comments, reviews and review
# comments name no setup of ours, leave nothing open without an issue and name no
# other repository's issue without its owner. A push to develop reads the commit
# messages it brings and every pull request it touched, so a comment after the
# merge and a squash message that lands are checked too. The pull request events
# run from the merge ref, so this file works before a release reaches main; an
# issue_comment run and a schedule take effect only from the default branch.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: public-text-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  public-text:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Public text against the rules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 dev/public-text-check 2>&1 | tee "$RUNNER_TEMP/public-text.txt"
      - name: Tell a person that a push to develop broke the rules
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/public-text-notice.md"
          {
            echo "The \`public-text\` check failed on a push to \`develop\`. The commit is ${COMMIT_URL} and the run is ${RUN_URL}."
            echo
            echo "Check output:"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/public-text.txt"
            echo
            echo "Edit the text that failed, or record here why it stays."
          } > "$body"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "public-text failed on develop" --body-file "$body" --assignee "$ACTOR"
