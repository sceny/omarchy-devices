name: release

# Releasing (AGENTS.md), the steps after the release pull request:
# - a pull request into main is checked first: the version in manifest.json
#   needs its CHANGELOG section (`## X.Y.Z — YYYY-MM-DD`) and no tag yet;
# - when main gets a version with no tag, the pushed commit is tagged
#   vX.Y.Z, the release is published with that CHANGELOG section as its
#   notes, and develop is brought level with main.
# - a release that reaches main as a single-parent commit (a squash or a
#   rebase) fails the run once it is tagged: the release pull request is
#   merged with a merge commit. GitHub offers no per-pull-request check of the
#   merge method, so it is caught here, after the merge.
# `dev/release-prepare X.Y.Z` makes a branch that passes the first check.
# A push to main whose version is already tagged does nothing. The
# marketplace review is still requested by hand (Releasing, step 4).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: ${{ github.event_name == 'push' && 'write' || 'read' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version and its notes
        id: version
        run: |
          version=$(jq -r .version manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The section under "## X.Y.Z — date", up to the next "## ",
          # without the blank lines around it.
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/[^[:space:]]/,$!d' | sed -e ':a' -e '/^[[:space:]]*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/notes.md"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: A release into main is ready
        if: github.event_name == 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAGGED: ${{ steps.version.outputs.tagged }}
        run: |
          version="$VERSION"
          if [ "$TAGGED" = true ]; then
            echo "::error file=manifest.json::v$version is already released: set the new version in manifest.json"
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::No '## $version — YYYY-MM-DD' section with entries"
            exit 1
          fi
          echo "::notice::Merge this pull request with a merge commit, never squash: the release run fails on a single-parent commit on main"
          echo "Release notes for v$version:"
          cat "$RUNNER_TEMP/notes.md"

      - name: Tag and publish
        if: github.event_name == 'push' && steps.version.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::No '## $version — YYYY-MM-DD' section with entries; nothing tagged"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Devices $version" "$GITHUB_SHA"
          git push origin "v$version"
          gh release create "v$version" --title "Devices $version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest

      - name: Bring develop level with main
        if: github.event_name == 'push' && steps.version.outputs.tagged == 'false'
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:refs/heads/develop"
          else
            echo "::warning::develop has commits main does not; merge main into develop by hand (AGENTS.md, Workflow: an urgent fix)"
          fi

      - name: The release arrived as a merge commit
        if: github.event_name == 'push' && steps.version.outputs.tagged == 'false' && !cancelled()
        run: |
          parents=$(git rev-list --parents -n 1 "$GITHUB_SHA" | wc -w)
          if [ "$parents" -lt 3 ]; then
            echo "::error::$GITHUB_SHA has one parent: the release pull request was squashed or rebased. It is tagged and published as it stands; merge with a merge commit next time so main and develop keep one history"
            exit 1
          fi
