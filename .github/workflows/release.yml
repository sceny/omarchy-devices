name: release

# Releasing (AGENTS.md), the steps after the release pull request:
# - a pull request into main is checked first (job check, read-only): the
#   version in manifest.json needs its CHANGELOG section
#   (`## X.Y.Z — YYYY-MM-DD`) and no tag yet;
# - when main gets a version with no tag (job publish, the only job that
#   writes), the pushed commit is tagged vX.Y.Z, the release is published
#   with that CHANGELOG section as its notes, and develop is brought level
#   with main.
# Two jobs because GitHub takes no expression under `permissions`: a file
# with one fails every run in 0 s.
# A push to main whose version is already tagged does nothing. The
# marketplace review is still requested by hand (Releasing, step 4).

on:
  pull_request:
    branches: [main, SCE-621-proof-tmp]
  push:
    branches: [main, SCE-621-proof-tmp]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A release into main is ready
        run: |
          eval "$(dev/release-notes "$RUNNER_TEMP/notes.md" | sed 's/^/export /')"
          if [ "$tagged" = true ]; then
            echo "::error file=manifest.json::v$version is already released: set the new version in manifest.json"
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::No '## $version — YYYY-MM-DD' section with entries"
            exit 1
          fi
          echo "Release notes for v$version:"
          cat "$RUNNER_TEMP/notes.md"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version and its notes
        id: version
        run: dev/release-notes "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Tag and publish
        if: steps.version.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::No '## $version — YYYY-MM-DD' section with entries; nothing tagged"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Devices $version" "$GITHUB_SHA"
          git push origin "v$version"
          gh release create "v$version" --title "Devices $version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest

      - name: Bring develop level with main
        if: steps.version.outputs.tagged == 'false'
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:refs/heads/develop"
          else
            echo "::warning::develop has commits main does not; merge main into develop by hand (AGENTS.md, Workflow: an urgent fix)"
          fi
