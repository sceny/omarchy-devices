name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: PyGObject for the bridge, qmlformat for the QML
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-gi gir1.2-gdkpixbuf-2.0 qt6-declarative-dev-tools
      - name: QML parses (a syntax error takes the whole widget off the bar)
        run: |
          fmt=$(ls /usr/lib/qt6/bin/qmlformat /usr/lib/x86_64-linux-gnu/qt6/bin/qmlformat 2>/dev/null | head -1)
          test -n "$fmt" || { echo "qmlformat not found"; exit 1; }
          for f in *.qml; do "$fmt" "$f" > /dev/null || { echo "::error file=$f::does not parse"; exit 1; }; done
      - name: Model
        run: node --test tests/*.test.js
      - name: Bridge
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Manifest is valid JSON with the expected id
        run: jq -e '.id == "sceny.devices" and .schemaVersion == 1' manifest.json
