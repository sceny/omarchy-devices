# Per-plugin configuration for the Omarchy plugin test rig.
#
# This is the ONLY file a second plugin repo has to change. Copy the whole
# dev/ directory into the other repo and edit the values below.
#
# shellcheck shell=bash

# The plugin id in manifest.json. The rig installs, enables, disables and
# removes exactly this id and refuses to touch anything else.
RIG_PLUGIN_ID="sceny.devices"

# Where the plugin source lives, relative to this file's directory (dev/).
# ".." means "the repo this dev/ directory sits in".
RIG_PLUGIN_SRC=".."

# Bar section the rig enables the widget into: left, center or right.
RIG_BAR_SECTION="right"

# Fallback for a source that is not a git checkout: files and directories
# copied into the throwaway git repo the rig installs from. In a git checkout
# the rig packages the tracked tree instead, which is the whole repository, as
# `omarchy plugin add` installs it.
RIG_PACKAGE_PATHS=(manifest.json bin)

# ---------------------------------------------------------------- the phone ----
#
# The rig's phone is a headless Android emulator paired to a KDE Connect daemon
# that lives on the rig's own session bus, in the rig's own network namespace.
# Neither the owner's daemon nor the owner's phone is reachable from in there.

# The emulator image and the pinned KDE Connect for Android. The APK is
# downloaded once into $RIG_TMP_ROOT/cache, checked against this hash and the
# signer's certificate every time, and installed with `adb install`.
RIG_ANDROID_API=34
RIG_ANDROID_IMAGE="system-images;android-34;google_apis;x86_64"
RIG_KDC_APK_NAME="org.kde.kdeconnect_tp_13517.apk"
RIG_KDC_APK_URL="https://f-droid.org/repo/org.kde.kdeconnect_tp_13517.apk"
RIG_KDC_APK_SHA256="081f95a9f54a2113f65ef5cb81d79cab42cabe815aad6052e3f0ef1000929dad"
RIG_KDC_APK_SIGNER_SHA256="79b50031486746dffbc746f48fb0eb62fc7bb0ae7b976e7d6507b2c078840d92"

# How big the emulator is. Small on purpose: this is a phone for a panel to
# talk to, not a phone to use.
RIG_EMU_RAM_MB=1536
RIG_EMU_DATA_GB=2
RIG_EMU_CORES=2
RIG_EMU_WIDTH=720
RIG_EMU_HEIGHT=1280
RIG_EMU_DENSITY=320

# The name the rig's KDE Connect daemon announces. The phone shows it when
# pairing, so it is a fixed neutral one and never this computer's hostname.
RIG_KDC_NAME="Rig laptop"
